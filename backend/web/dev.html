<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolveX dev</title>
<link rel="stylesheet" href="/static/panel.css">
<style>
  body { height: 100vh; overflow: hidden; }
  header { flex: none; }
  header nav a + a { margin-left: 0; }
  main {
    flex: 1; min-height: 0; display: grid; gap: 16px; padding: 0 24px 20px;
    grid-template-columns: minmax(340px, 1.15fr) minmax(430px, 1.45fr) minmax(280px, 1fr);
  }
  .col { min-height: 0; display: flex; flex-direction: column; gap: 16px; }
  .panel { background: var(--tarmac); color: var(--white); padding: 14px 16px; }
  .panel h2 { margin: 0 0 10px; font-size: 1.15rem; font-weight: 700; }
  .panel p { margin: 0 0 8px; line-height: 1.35; }
  .muted { color: #b9c4c9; }
  .buttons { display: flex; flex-wrap: wrap; gap: 10px; }
  .buttons button { background: var(--line); color: var(--tarmac); padding: 10px 18px; font-size: 1.05rem; }
  .buttons button:disabled { background: var(--tarmac-soft); color: #8fa0a8; cursor: default; }
  .auto { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-weight: 700; }
  .auto input { width: 22px; height: 22px; accent-color: var(--line); }
  .scene { padding: 0; flex: none; }
  .scene canvas { display: block; width: 100%; height: auto; background: #5d7a4f; }
  .scene .caption { margin: 0; padding: 10px 16px; min-height: 3.4em; font-size: 1.1rem; line-height: 1.3; }
  .caption[data-tone="alarm"] { color: #ffb4ae; font-weight: 700; }
  .caption[data-tone="clear"] { color: #8fe0c0; font-weight: 700; }
  code { font-size: .9em; overflow-wrap: anywhere; }

  .phones { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .phone { min-height: 0; display: flex; flex-direction: column; background: var(--tarmac); border: 5px solid var(--tarmac); }
  .phone > header { padding: 8px 10px; color: var(--white); display: block; }
  .phone > header b { display: block; font-size: 1rem; }
  .phone > header span { font-size: .9rem; color: #b9c4c9; }
  .screen { flex: 1; min-height: 0; overflow-y: auto; background: var(--concrete); color: var(--tarmac); padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .idle { margin: auto; color: #6b7c85; }
  .note { background: var(--white); padding: 8px 10px; border-left: 6px solid var(--tarmac-soft); }
  .note[data-state="open"] { border-left-color: var(--line); }
  .note[data-kind="alert"] { border-left-color: var(--alarm); }
  .note h4 { margin: 0 0 2px; font-size: 1rem; }
  .note p { margin: 0 0 6px; font-size: .95rem; line-height: 1.3; }
  .note .state { font-size: .9rem; color: #5d6f78; }
  .note .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .note .actions button { padding: 6px 12px; font-size: .95rem; background: var(--tarmac); }
  .note .actions button.main { background: var(--clear); }
  .note .cd { font-weight: 700; color: var(--alarm); }

  .log { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .log ol { margin: 0; padding: 0; list-style: none; overflow-y: auto; flex: 1; min-height: 0; font-size: .95rem; line-height: 1.35; }
  .log li { padding: 5px 0; border-top: 1px solid var(--tarmac-soft); }
  .log li.dev { color: #b9c4c9; font-style: italic; }
  .log time { display: inline-block; width: 4.6em; color: var(--line); font-style: normal; }

  @media (max-width: 1100px) {
    body { height: auto; overflow: auto; }
    main { grid-template-columns: 1fr; }
    .phones { grid-template-columns: repeat(2, 1fr); grid-template-rows: none; grid-auto-rows: 260px; }
    .log ol { max-height: 320px; }
  }
</style>
</head>
<body>
<header>
  <span>SolveX dev</span>
  <nav>
    <span id="link" data-up="false" role="status">Connecting to the server</span>
    <a href="/" target="_blank" rel="noopener">Open the dashboard</a>
    <a href="/dev/monitor" target="_blank" rel="noopener">Monitor</a>
    <a href="/dev/live" target="_blank" rel="noopener">Live view</a>
    <a href="/dev/simulator" target="_blank" rel="noopener">Simulator</a>
    <button id="reset-all" type="button">Reset all</button>
  </nav>
</header>
<main>
  <div class="col">
    <section class="panel">
      <h2>Scenarios</h2>
      <div class="buttons">
        <button type="button" data-start="a">Scenario A: ambulance close</button>
        <button type="button" data-start="b">Scenario B: far, high severity</button>
        <button type="button" data-start="2">Scenario 2: no one around</button>
        <button type="button" data-start="3">Scenario 3: no network</button>
      </div>
      <label class="auto"><input type="checkbox" id="auto"> Auto: if anyone is nearby a witness confirms, and a helper accepts by themselves. User 0 never answers.</label>
      <p class="muted" style="margin-top:12px" id="scenario-info">Press a scenario. The crash of user 0's car goes through the real pipeline: M2, then M3 and M4.</p>
      <p class="muted">From a terminal: <code id="curl"></code></p>
    </section>
    <section class="panel scene">
      <canvas id="scene" width="800" height="450" aria-label="User 0's car"></canvas>
      <p class="caption" id="caption"></p>
    </section>
  </div>
  <div class="col">
    <div class="phones" id="phones"></div>
  </div>
  <div class="col">
    <section class="panel log">
      <h2>Event log</h2>
      <ol id="log"></ol>
    </section>
  </div>
</main>

<script src="/static/vendor/socketio/socket.io.min.js"></script>
<script src="/static/common.js"></script>
<script src="/static/scenes.js"></script>
<script>
const link = document.getElementById("link");
const phonesEl = document.getElementById("phones");
const logEl = document.getElementById("log");
const captionEl = document.getElementById("caption");
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
document.getElementById("curl").textContent = `curl -N http://${location.host}/dev/run/a`;

let snap = null, car = null, phonesSig = "", receivedAt = 0;
let users = [], notes = {}, sockets = [], agentToken = null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clock = t => new Date(t * 1000).toLocaleTimeString("en-GB");
const post = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}) });
// Every phone is a logged-in user of the real API: the same calls the React Native app makes
const asUser = (user, method, path, body) => fetch("/api/v1" + path, { method, headers: { "Content-Type": "application/json", Authorization: `Bearer ${user.token}` },
  body: body === undefined ? undefined : JSON.stringify(body) });
const allNotes = () => Object.values(notes).flat();

document.querySelectorAll("[data-start]").forEach(b => b.addEventListener("click", async () => {
  b.disabled = true;
  await post(`/dev/start/${b.dataset.start}`);
  b.disabled = false;
  await loadAll();
}));
document.getElementById("reset-all").addEventListener("click", async () => { await post("/dev/reset"); await loadAll(); });
document.getElementById("auto").addEventListener("change", e => post("/dev/auto", { on: e.target.checked }));
phonesEl.addEventListener("click", async e => {
  const b = e.target.closest("button[data-note]");
  if (!b) return;
  b.disabled = true;
  const user = users.find(u => u.id === Number(b.dataset.user));
  await asUser(user, "POST", `/notifications/${b.dataset.note}/respond`, { action: b.dataset.action });
  await loadNotes(user);
});

function phoneHtml(user, list) {
  // Newest first, but anything with a countdown stays on top
  const urgent = n => (n.state === "open" && n.remaining_s !== null ? 1 : 0);
  const items = list.slice().reverse().sort((a, b) => urgent(b) - urgent(a)).map(n => {
    const answered = n.answer ? n.actions.find(a => a.id === n.answer)?.label : null;
    const footer = n.state === "open"
      ? `<div class="actions">${n.actions.map((a, i) => `<button type="button" class="${i === 0 ? "main" : ""}" data-user="${user.id}" data-note="${n.id}" data-action="${a.id}">${esc(a.label)}</button>`).join("")}</div>`
        + (n.remaining_s !== null ? `<p class="state">Time left: <span class="cd" data-note="${n.id}"></span></p>` : "")
      : n.state === "answered" ? `<p class="state">Answered: ${esc(answered)}</p>` : n.state === "expired" ? `<p class="state">No answer</p>` : "";
    return `<div class="note" data-state="${n.state}" data-kind="${n.kind}"><h4>${esc(n.title)}</h4><p>${esc(n.text)}</p>${footer}</div>`;
  }).join("") || `<p class="idle">No notifications</p>`;
  return `<article class="phone"><header><b>${user.id}. ${esc(user.name)}</b><span>${esc(user.role)}</span></header><div class="screen">${items}</div></article>`;
}

function renderPhones() {
  const sig = JSON.stringify([users.map(u => [u.id, u.role]), allNotes().map(n => [n.id, n.state, n.answer])]);
  if (sig === phonesSig) return;
  phonesSig = sig;
  phonesEl.innerHTML = users.map(u => phoneHtml(u, notes[u.id] || [])).join("");
}

function renderLog(s) {
  logEl.innerHTML = s.events.slice().reverse().map(e => `<li class="${e.who}"><time>${clock(e.t)}</time>${esc(e.text)}</li>`).join("");
}

function renderControls(s) {
  document.getElementById("auto").checked = s.auto;
  const sc = s.scenario;
  document.getElementById("scenario-info").textContent = sc
    ? `${sc.title}. The ambulance's drive is compressed to ${sc.trip_s} s on screen; the ETA shows real minutes.`
    : "Press a scenario. The crash of user 0's car goes through the real pipeline: M2, then M3 and M4.";
}

function syncAnimation(s) {
  const sc = s.scenario;
  if (!sc) { car = null; return; }
  if (!car || car.runId !== sc.device_id) {
    // The blackbox starts right after the scenario does, with no lead-in: the impact comes 8 s in
    car = { runId: sc.device_id, kind: "crash", cruise: 20.3, color: "#3b82c4", ctx, scn: null, x: 0, fx: [], result: null, resultAt: 0,
            impactDone: false, lastSmoke: 0, leadOn: true, idleText: "",
            // In scenario 3 the car drives first, and the crash starts once it is inside the zone
            scenarioAt: sc.kind === "dead_zone" ? null : performance.now() - sc.elapsed_s * 1000 };
  }
  if (s.dead_zone?.phase === "in_zone" && !car.scn && car.scenarioAt === null) car.scenarioAt = performance.now();
  const m2 = s.incident?.m2;
  if (m2 && !car.result) { car.result = m2; car.resultAt = performance.now(); }
}

function deadZoneCaption(dz) {
  if (dz.phase === "driving") return "Driving towards the no-coverage zone. Everything still reaches the server.";
  if (dz.phase === "turned_back") return "The driver turned back.";
  if (dz.found) return "Help found the driver.";
  if (dz.phase === "overdue") return "Not back in time. The server still knows nothing about the crash: help goes to the last known position.";
  return dz.crashed ? "A crash in the zone. The blackbox keeps the data, but nothing reaches the server." : "In the zone: no network, so nothing reaches the server.";
}

function onSnapshot(s) {
  snap = s; receivedAt = performance.now();
  renderControls(s); renderPhones(); renderLog(s); syncAnimation(s);
}

let lastFrame = performance.now();
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  if (car) {
    if (car.scenarioAt !== null && now >= car.scenarioAt) { car.scn = { startAt: car.scenarioAt, x0: car.x }; car.leadWasVisible = true; car.scenarioAt = null; }
    const p = update(car, now, dt);
    drawScene(car, now, p);
    const [text, tone] = snap?.dead_zone ? [deadZoneCaption(snap.dead_zone), ""] : captionFor(car, p, now);
    if (captionEl.textContent !== text) captionEl.textContent = text;
    captionEl.dataset.tone = tone;
  } else {
    ctx.fillStyle = "#24343d"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#b9c4c9"; ctx.font = "32px system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("Press a scenario to start", W / 2, H / 2);
    ctx.textAlign = "left";
    captionEl.textContent = "";
  }
  document.querySelectorAll(".cd").forEach(el => {  // the countdowns on the phones
    const n = allNotes().find(x => x.id === Number(el.dataset.note));
    if (n && n.remaining_s !== null) el.textContent = `${Math.max(0, n.remaining_s - (now - n.got) / 1000).toFixed(0)} s`;
  });
}

async function loadNotes(user) {
  const list = await (await asUser(user, "GET", "/notifications")).json();
  notes[user.id] = list.map(n => ({ ...n, got: performance.now() }));
  renderPhones();
}

async function loadState() {
  const s = await (await fetch("/dev/state")).json();
  if (!users.length) { users = s.users; agentToken = s.agent.token; }
  else s.users.forEach(u => { users.find(x => x.id === u.id).role = u.role; });   // the tokens stay, the roles follow the place
  onSnapshot(s);
}

const loadAll = () => loadState().then(() => Promise.all(users.map(loadNotes)));

let soon = null;
function refreshSoon() { clearTimeout(soon); soon = setTimeout(() => loadAll().catch(() => {}), 150); }

function connect() {
  // The agent's socket says when something changed; each phone listens as its own user
  const agent = io({ auth: { token: agentToken }, transports: ["websocket", "polling"] });
  agent.on("connect", () => { link.textContent = "Connected to the server"; link.dataset.up = "true"; refreshSoon(); });
  agent.on("disconnect", () => { link.textContent = "Server not reachable. Retrying."; link.dataset.up = "false"; });
  agent.on("incident.updated", refreshSoon);
  agent.on("reset", refreshSoon);
  for (const user of users) {
    const phone = io({ auth: { token: user.token }, transports: ["websocket", "polling"] });
    phone.on("notification", n => {
      const list = notes[user.id] || (notes[user.id] = []);
      const at = list.findIndex(x => x.id === n.id);
      const item = { ...n, got: performance.now() };
      if (at >= 0) list[at] = item; else list.push(item);
      phone.emit("notification.ack", { id: n.id });     // what the app does, or the server falls back to push and SMS
      renderPhones();
    });
    sockets.push(phone);
  }
  setInterval(() => loadAll().catch(() => {}), 2000);   // the state that is not an event: the scenario clock, the dead-zone phase
}

loadAll().then(connect).catch(() => { link.textContent = "Server not reachable. Retrying."; });
requestAnimationFrame(frame);

</script>
</body>
</html>
