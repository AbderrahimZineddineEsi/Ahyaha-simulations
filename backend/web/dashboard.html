<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolveX Protection Civile</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/theme.css">
<style>
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .topbar .where { color: var(--muted); font-family: var(--font-sans); font-size: .95rem; font-weight: 500; margin-left: 6px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 350px minmax(0, 1fr) 410px; }
  aside { min-height: 0; overflow-y: auto; background: var(--bg); }
  aside.left { border-right: 1px solid var(--border); }
  aside.right { border-left: 1px solid var(--border); }
  h2 { margin: 0; padding: 16px 18px 8px; font-size: 1.2rem; color: var(--muted); }
  h2:not(:first-child) { border-top: 1px solid var(--border); margin-top: 8px; }
  section { padding-bottom: 6px; }
  .empty { padding: 4px 18px 16px; line-height: 1.4; color: var(--muted); }
  .muted { color: var(--muted); }

  #map { position: relative; background: var(--surface-2); }
  .leaflet-container { font: 500 .95rem/1.4 var(--font-sans); }
  .legend { position: absolute; z-index: 800; left: 12px; bottom: 28px; background: rgba(255, 255, 255, .94); border: 1px solid var(--border); box-shadow: var(--shadow-2); padding: 8px 12px; font-size: .85rem; line-height: 1.2; border-radius: var(--r-md); display: grid; gap: 3px; }
  .legend div.row-key { display: flex; align-items: center; gap: 8px; }
  .legend .pin { width: 21px; height: 21px; border-width: 1.5px; box-shadow: none; flex: none; font-size: .7rem; }
  .legend .pin svg { width: 13px; height: 13px; }
  .legend .pin.pc svg { width: 100%; height: 100%; }
  .legend .pin .badge { display: none; }
  .leaflet-control-attribution { background: rgba(255, 255, 255, .85) !important; color: var(--muted) !important; }
  .leaflet-control-attribution a { color: var(--ink) !important; }
  .pin { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: var(--white); font: 700 .95rem var(--font-sans); border: 3px solid var(--white); box-shadow: 0 1px 5px rgba(20, 32, 26, .35); }
  .pin { position: relative; }
  .pin svg { width: 19px; height: 19px; display: block; fill: currentColor; }
  .pin .badge { position: absolute; right: -8px; bottom: -8px; min-width: 16px; height: 16px; padding: 0 3px; display: grid; place-items: center; border-radius: 8px; border: 1.5px solid var(--white); background: var(--ink); color: var(--white); font: 700 .62rem/1 var(--font-sans); white-space: nowrap; }
  .pin.amb { border-radius: var(--r-sm); background: var(--surface); color: var(--brand); border-color: var(--brand); }
  .pin.amb .badge { background: var(--brand); }
  .pin.amb[data-moving="true"] { box-shadow: 0 0 0 5px rgba(0, 98, 51, .4); }
  .pin.station { border-radius: var(--r-sm); }
  .pin.station.police { background: var(--police); }
  .pin.station.gendarmerie { background: var(--gendarmerie); }
  .pin.pc { border-radius: var(--r-sm); background: var(--pc-orange); overflow: hidden; }
  .pin.pc svg { width: 100%; height: 100%; fill: var(--pc-blue); }
  .pin.hospital { border-radius: var(--r-sm); background: var(--brand); }
  .pin.unit { border-radius: var(--r-sm); }
  .pin.unit.police { background: var(--police); }
  .pin.unit.gendarmerie { background: var(--gendarmerie); }
  .pin.unit[data-moving="true"] { box-shadow: 0 0 0 5px rgba(20, 32, 26, .2); }
  .pin.user { background: var(--ink-2); }
  .pin.victim { background: var(--sev-extreme); }
  .pin.helper { background: var(--brand); }
  .pin.helper .badge { background: var(--white); border-color: var(--brand); color: var(--brand); font-size: .75rem; }
  .pin.driver { background: var(--ink-2); outline: 3px solid var(--brand); }
  .pin.lost { background: var(--conf-suspected); }
  .pin.crash { width: 44px; height: 44px; background: var(--sev-extreme); font-size: 1.5rem; animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(210, 16, 52, .75); } 100% { box-shadow: 0 0 0 28px rgba(210, 16, 52, 0); } }

  /* What the agent just did, over the map: the lines fade, they are not a log */
  #ticker { position: absolute; z-index: 850; right: 12px; bottom: 30px; width: min(460px, calc(100% - 290px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .tick { background: rgba(255, 255, 255, .96); border: 1px solid var(--border); border-left: 4px solid var(--brand); border-radius: var(--r-md); padding: 8px 12px; line-height: 1.3; box-shadow: 0 4px 14px rgba(20, 32, 26, .14); animation: tick-in .25s ease-out; }
  .tick.out { opacity: 0; transform: translateY(6px); transition: opacity .4s, transform .4s; }
  @keyframes tick-in { from { opacity: 0; transform: translateY(8px); } }

  #popup { position: absolute; z-index: 900; top: 14px; left: 50%; transform: translateX(-50%); width: min(600px, calc(100% - 90px)); background: var(--surface); color: var(--ink); border-top: 6px solid var(--brand); border-radius: var(--r-lg); padding: 14px 18px 16px; box-shadow: 0 10px 30px rgba(20, 32, 26, .22); }
  #popup:empty { display: none; }
  #popup[data-mood="alarm"] { border-top-color: var(--sev-extreme); }
  #popup h3 { margin: 0 0 4px; font-size: 1.5rem; }
  #popup p { margin: 0 0 10px; line-height: 1.4; color: var(--ink-2); }
  .zone-label { background: none; border: 0; box-shadow: none; color: var(--muted); font: 600 1rem var(--font-sans); }

  .incident-head { padding: 14px 18px 16px; }
  .incident-head[data-mood="watch"] { background: var(--sev-medium); color: var(--ink); }
  .incident-head[data-mood="alarm"] { background: var(--sev-extreme); color: var(--white); }
  .incident-head[data-mood="move"] { background: var(--brand-subtle); border-bottom: 4px solid var(--brand); }
  .incident-head[data-mood="clear"] { background: var(--brand); color: var(--white); }
  .incident-head small { display: block; opacity: .9; font-size: .95rem; }
  .incident-head strong { display: block; margin-top: 2px; font-family: var(--font-sans); font-size: 1.9rem; font-weight: 600; line-height: 1.1; }
  .block { padding: 4px 18px 12px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 3px 0; }
  .level { font-family: var(--font-sans); font-size: 2.2rem; font-weight: 600; text-transform: capitalize; line-height: 1.1; }
  .level[data-level="low"] { color: var(--sev-low); }
  .level[data-level="high"] { color: var(--sev-high); }
  .level[data-level="extreme"] { color: var(--sev-extreme); }
  .regions { margin: 6px 0 0; padding: 0; list-style: none; }
  .regions li { display: grid; grid-template-columns: 5.5em 1fr 4.2em; align-items: center; gap: 8px; padding: 3px 0; font-size: .98rem; text-transform: capitalize; }
  .bar { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--reg-unlikely); }
  .regions li[data-state="likely"] .bar i { background: var(--reg-likely); }
  .regions li[data-state="check"] .bar i { background: var(--reg-check); }
  .regions li[data-state="unlikely"] { color: var(--muted); }
  .state { text-align: right; font-size: .9rem; text-transform: none; }
  .person { line-height: 1.45; }
  .person b { font-size: 1.15rem; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; margin-top: 8px; }
  .actions > * { flex: 1 1 auto; }
  select { background: var(--surface); color: var(--ink); border-color: var(--border-strong); text-transform: capitalize; }
  .done { padding: 8px 0; color: var(--brand); font-weight: 600; }

  .card { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-1); padding: 11px 13px; margin-top: 8px; line-height: 1.4; border-radius: var(--r-lg); }
  .card .row b { font-size: 1.1rem; }
  .card .row .quick { font-size: .92rem; white-space: nowrap; }
  .card .row .quick b { font-size: 1rem; }
  .card .eta { font-family: var(--font-sans); font-size: 2.3rem; font-weight: 600; line-height: 1.1; color: var(--brand); font-variant-numeric: tabular-nums; }
  .card .meter { height: 6px; background: var(--surface-2); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .card .meter i { display: block; height: 100%; background: var(--brand); }
  .card[data-best="true"] { box-shadow: inset 4px 0 0 var(--brand); }
  .tag { font-size: .85rem; padding: 2px 9px; border-radius: var(--r-md); background: var(--surface-2); color: var(--muted); }
  .tag.ok { background: var(--brand); color: var(--white); }
  .tag.best { background: var(--brand); color: var(--white); font-weight: 600; }
  .calling { color: var(--brand); font-weight: 600; }
  .hint { color: var(--muted); font-size: .92rem; margin: 6px 0 0; }

  .incidents { list-style: none; margin: 0; padding: 0 0 8px; }
  .incidents button { display: block; width: 100%; text-align: left; background: transparent; color: var(--ink); border: 0; border-radius: 0; box-shadow: none; padding: 9px 18px; font-weight: 400; line-height: 1.3; border-top: 1px solid var(--border); }
  .incidents button:hover:not(:disabled) { background: var(--surface-2); box-shadow: none; }
  .incidents button[aria-current="true"], .incidents button[aria-current="true"]:hover:not(:disabled) { background: var(--brand-subtle); box-shadow: inset 5px 0 0 var(--brand); }
  .incidents button b { display: block; font-weight: 600; }
  .incidents button span { color: var(--muted); font-size: .92rem; }
  .incidents button[data-mood="alarm"] b { color: var(--sev-extreme); }

  @media (max-width: 1000px) {
    body { height: auto; overflow: auto; }
    main { grid-template-columns: 1fr; }
    #map { height: 60vh; }
    aside { overflow: visible; }
  }
  .login { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; background: rgba(250, 248, 243, .96); }
  .login[hidden] { display: none; }
  .login form { background: var(--surface); box-shadow: var(--shadow-2); padding: 24px 28px 26px; width: min(380px, calc(100% - 32px)); border-top: 6px solid var(--brand); border-radius: var(--r-lg); }
  .login h1 { margin: 0 0 12px; font-size: 1.8rem; }
  .login label { display: block; margin-top: 10px; font-weight: 600; }
  .login input { display: block; width: 100%; margin-top: 4px; padding: 10px; font: inherit; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); color: var(--ink); }
  .login button { margin-top: 16px; width: 100%; }
  .login .error { color: var(--sev-extreme); font-weight: 600; margin-top: 10px; min-height: 1.2em; }
  header button.quiet { padding: 5px 12px; }
  @media (prefers-reduced-motion: reduce) { .pin.crash { animation: none; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><i></i>Protection Civile<span class="where" id="who"></span></div>
  <nav>
    <span class="link" id="link" data-up="false" role="status">Connecting to the server</span>
    <a href="/dev" id="dev-link" target="_blank" rel="noopener" hidden>Open the demo stage</a>
    <button type="button" class="quiet" id="logout" hidden>Log out</button>
  </nav>
</header>
<main>
  <aside class="left">
    <h2>Incidents</h2>
    <div class="empty" id="no-incidents">No incident. This list fills as soon as a crash is detected.</div>
    <ul class="incidents" id="incidents"></ul>
    <div id="fleet"></div>
  </aside>
  <div id="map" role="application" aria-label="Map">
    <div class="legend" id="legend"></div>
    <div id="popup" role="alert"></div>
    <div id="ticker" aria-live="polite"></div>
  </div>
  <aside class="right" id="panel"></aside>
</main>

<div class="login" id="login" hidden>
  <form id="login-form">
    <h1>Protection Civile</h1>
    <label>Phone number<input id="phone" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Log in</button>
    <div class="error" id="login-error" role="alert"></div>
  </form>
</div>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/vendor/socketio/socket.io.min.js"></script>
<script>
"use strict";
const API = "/api/v1";
const LEVELS = ["low", "medium", "high", "extreme"];
const MOOD = { analyzing: "watch", detected: "alarm", agent_confirmed: "alarm", dispatched: "move", on_scene: "clear", false_alarm: "clear",
               transporting: "move", at_hospital: "clear", dead_zone_watch: "watch", in_zone: "move", turned_back: "clear", returned: "clear", closed: "clear", overdue: "alarm" };
const link = document.getElementById("link");
const panel = document.getElementById("panel");
const fleet = document.getElementById("fleet");
const ticker = document.getElementById("ticker");
const popup = document.getElementById("popup");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clock = t => new Date(t * 1000).toLocaleTimeString("en-GB");
const hhmm = iso => iso ? new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "";
const pct = p => p >= 0.9995 ? "over 99.9%" : `${(p * 100).toFixed(1)}%`;
const minutes = s => s >= 90 ? `${Math.round(s / 60)} min` : `${Math.round(s)} s`;

let token = localStorage.getItem("solvex_token");
let socket = null;
const authHeaders = () => ({ "Content-Type": "application/json", Authorization: `Bearer ${token}` });
async function call(method, path, body) {
  const r = await fetch(API + path, { method, headers: authHeaders(), body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401) { logout(); throw new Error("login"); }
  return r;
}
const get = path => call("GET", path).then(r => r.json());
const post = (path, body) => call("POST", path, body ?? {});

let list = [], selected = null, shown = null, detail = null, ambulances = [], centres = [], stations = [], units = [];
let snap = null, sig = "", eventCount = 0, regions = null, region = null;
const streets = {};   // region name -> the layer of its streets
let severityChoice = null, severityTouched = false;
const calling = {};   // user id -> when the agent pressed Call (a mock: there is no phone line yet)

// ---------------------------------------------------------------- map

const map = L.map("map", { zoomControl: true, attributionControl: true, minZoom: 5, maxZoom: 18, preferCanvas: true });
map.attributionControl.setPrefix(false);
map.attributionControl.addAttribution("Streets © OpenStreetMap contributors");
map.setView([36.37, 3.9], 12);
const WIDTH = { motorway: 7, trunk: 7, primary: 6, secondary: 5, tertiary: 4, unclassified: 3, residential: 3, living_street: 2, service: 2 };
const NEARBY_M = 8000;
const markers = {}, lines = {};

// Drawn here, not downloaded: the map has to work with no internet
const ICONS = {
  car: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 6c-.2-.6-.8-1-1.4-1h-11c-.7 0-1.2.4-1.4 1L3 12v8c0 .6.4 1 1 1h1c.6 0 1-.4 1-1v-1h12v1c0 .6.4 1 1 1h1c.6 0 1-.4 1-1v-8l-2.1-6zM6.5 16a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm11 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM5 11l1.5-4.5h11L19 11H5z"/></svg>`,
  patrol: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="0.5" width="7" height="3.5" rx="1"/><path d="M18.9 6c-.2-.6-.8-1-1.4-1h-11c-.7 0-1.2.4-1.4 1L3 12v8c0 .6.4 1 1 1h1c.6 0 1-.4 1-1v-1h12v1c0 .6.4 1 1 1h1c.6 0 1-.4 1-1v-8l-2.1-6zM6.5 16a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm11 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM5 11l1.5-4.5h11L19 11H5z"/></svg>`,
  ambulance: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M1 5.5A1.5 1.5 0 0 1 2.5 4H14a1 1 0 0 1 1 1v2h3.200a1.5 1.5 0 0 1 1.2.6L23 12.400V17a1 1 0 0 1-1 1h-1.200a2.8 2.8 0 0 1-5.6 0H9.800a2.8 2.8 0 0 1-5.6 0H2a1 1 0 0 1-1-1V5.500zM6.5 7v2.500H4v2.500h2.500v2.500H9V12h2.500V9.500H9V7H6.500zM15 9v3h5.500l-2.3-3H15z"/></svg>`,
  walker: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3z"/></svg>`,
  shield: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1 3 4.500V11c0 5.6 3.8 10.6 9 12 5.2-1.4 9-6.4 9-12V4.500L12 1z"/></svg>`,
  emblem: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 22.5 21.500h-21z"/></svg>`,
};

function pinHtml(cls, body, extra = "", badge = "") {
  return `<div class="pin ${cls}" ${extra}>${body}${badge ? `<b class="badge">${badge}</b>` : ""}</div>`;
}
function pin(cls, body, extra, badge) {
  return L.divIcon({ className: "", html: pinHtml(cls, body, extra, badge), iconSize: [30, 30], iconAnchor: [15, 15] });
}
document.getElementById("legend").innerHTML = [
  ["victim", ICONS.car, "Car in the crash"], ["user", ICONS.car, "Other cars nearby"], ["user", ICONS.walker, "People on foot"], ["helper", ICONS.car, "Helpers"],
  ["amb", ICONS.ambulance, "Ambulances"], ["unit police", ICONS.patrol, "Police"], ["unit gendarmerie", ICONS.patrol, "Gendarmerie"],
  ["pc", ICONS.emblem, "Protection Civile"], ["station police", ICONS.shield, "Police station"], ["station gendarmerie", ICONS.shield, "Gendarmerie brigade"], ["hospital", "H", "Hospitals"],
].map(([cls, body, label]) => `<div class="row-key">${pinHtml(cls, body)}${label}</div>`).join("");
const SCENE = -2000, BUILDING = -1000;   // whoever can move stays on top, and the crash's big disc must not hide a hospital next to it
function setMarker(key, position, icon, title, zIndexOffset = 0) {
  if (markers[key]) { markers[key].setLatLng(position).setIcon(icon); return; }
  markers[key] = L.marker(position, { icon, title, keyboard: false, zIndexOffset }).addTo(map);
}
function dropMarker(key) { if (markers[key]) { map.removeLayer(markers[key]); delete markers[key]; } }
function setLine(key, points, style) { if (!lines[key]) lines[key] = L.polyline(points, style).addTo(map); }
function dropLine(key) { if (lines[key]) { map.removeLayer(lines[key]); delete lines[key]; } }
function dropLines() { Object.keys(lines).forEach(k => { map.removeLayer(lines[k]); delete lines[k]; }); }
function dropAll() { Object.keys(markers).forEach(dropMarker); dropLines(); }

// The streets are drawn from OpenStreetMap data, so the map works with no internet. Regions without a file show only markers and routes.
async function loadRegions() {
  try { regions = await (await fetch("/static/regions.json")).json(); } catch (e) { regions = {}; }
}
function regionOf(point) {
  return Object.entries(regions || {}).find(([, r]) => point[0] >= r.bounds[0][0] && point[0] <= r.bounds[1][0] && point[1] >= r.bounds[0][1] && point[1] <= r.bounds[1][1])?.[0] ?? null;
}
async function showRegion(name) {
  if (name === region) return;
  Object.values(streets).forEach(layer => map.removeLayer(layer));
  region = name;
  if (!name) return;
  if (!streets[name]) {
    let roads = [];
    try { roads = await (await fetch(`/static/roads_${name}.json`)).json(); } catch (e) { /* no street file */ }
    const layer = L.layerGroup();
    const draw = style => roads.forEach(r => L.polyline(r.p, { ...style(r), interactive: false, lineCap: "round", lineJoin: "round" }).addTo(layer));
    draw(r => ({ color: "#D3CCBB", weight: (WIDTH[r.c] ?? 2) + 2 }));   // outlines first, so crossings read as junctions
    draw(r => ({ color: "#FFFFFF", weight: WIDTH[r.c] ?? 2 }));
    streets[name] = layer;
  }
  if (region === name) streets[name].addTo(map);
}

// A crash with no GPS: the agent places it once a caller says where it is
map.on("click", async e => {
  const inc = snap?.incident;
  if (inc && !inc.location && !["analyzing", "false_alarm"].includes(inc.stage)) {
    await post(`/incidents/${inc.id}/location`, { lat: e.latlng.lat, lon: e.latlng.lng });
    sig = "";
  }
});

function fitToIncident() {
  const inc = snap?.incident;
  if (!inc) return;
  const points = [];
  if (inc.location) points.push([inc.location.lat, inc.location.lon]);
  centres.forEach(c => points.push([c.lat, c.lon]));
  (snap.users || []).forEach(u => u.pos && points.push(u.pos));
  if (inc.dead_zone) points.push(inc.dead_zone.zone.center);
  if (inc.location) {       // what is around the crash: a hospital in Alger would only zoom the street map away
    const around = L.latLng(inc.location.lat, inc.location.lon);
    [...hospitals, ...stations, ...units.filter(u => u.location).map(u => u.location)].forEach(x => { if (around.distanceTo([x.lat, x.lon]) < NEARBY_M) points.push([x.lat, x.lon]); });
  }
  if (points.length) map.fitBounds(L.latLngBounds(points).pad(0.2), { animate: false, maxZoom: 15 });
  showRegion(inc.location ? regionOf([inc.location.lat, inc.location.lon]) : null);
}

function renderMap() {
  const inc = snap?.incident, dz = snap?.dead_zone;
  for (const c of centres) setMarker("station" + c.id, [c.lat, c.lon], pin("pc", ICONS.emblem), c.name, BUILDING);
  for (const p of stations) setMarker("police" + p.id, [p.lat, p.lon], pin(`station ${p.force}`, ICONS.shield), p.name, BUILDING);
  for (const h of hospitals) setMarker("hospital" + h.id, [h.lat, h.lon], pin("hospital", "H"), h.name, BUILDING);
  for (const u of units) {
    if (u.location) setMarker(u.id, [u.location.lat, u.location.lon], pin(`unit ${u.force}`, ICONS.patrol, `data-moving="${u.state === "en_route"}"`, u.force[0].toUpperCase() + u.id.slice(-1)), u.name);
  }
  for (const a of ambulances) {
    if (a.state === "busy" || !a.pos) { dropMarker(a.id); continue; }
    setMarker(a.id, a.pos, pin("amb", ICONS.ambulance, `data-moving="${["dispatched", "transport"].includes(a.state)}"`, a.id.slice(-1)), a.name);
  }
  if (!inc) return;
  if (dz && !lines.zone) {
    lines.zone = L.circle(dz.zone.center, { radius: dz.zone.radius_m, color: "#8A9189", weight: 2, dashArray: "5 7", fillColor: "#8A9189", fillOpacity: 0.12, interactive: false })
      .bindTooltip("No network", { permanent: true, direction: "center", className: "zone-label" }).addTo(map);
  }
  if (inc.location && (!dz || dz.found)) setMarker("crash", [inc.location.lat, inc.location.lon], pin("crash", "!"), "Crash", SCENE); else dropMarker("crash");
  for (const u of snap.users) {
    if (u.kind === "victim" && dz?.found) { dropMarker("u" + u.id); continue; }
    if (!u.pos) continue;
    const lost = u.kind === "victim" && dz?.last_seen;
    const cls = u.kind === "victim" ? (lost ? "lost" : dz ? "driver" : "victim") : u.kind === "helper" || u.helper ? "helper" : "user";
    const body = lost ? "?" : cls === "user" && !u.driving ? ICONS.walker : ICONS.car;
    const where = lost ? dz.last_seen : u.pos;
    setMarker("u" + u.id, where, pin(cls, body, "", cls === "helper" ? "+" : ""), lost ? "Last known position" : u.name);
  }
  const toHospital = ["transport", "delivered"].includes(inc.dispatch?.state);
  if (toHospital && !lines.hospital) {      // the road to the crash is done: show the one to the hospital, which can be far off the map
    dropLine("amb");
    map.fitBounds(L.latLngBounds(inc.dispatch.route).pad(0.15), { animate: false, maxZoom: 15 });
  }
  if (inc.dispatch?.route) setLine(toHospital ? "hospital" : "amb", inc.dispatch.route, { color: "#006233", weight: 5, dashArray: "2 10", lineCap: "round" });
  for (const u of inc.police) {
    if (u.state === "en_route") setLine("p" + u.id, u.route, { color: "#3B4740", weight: 4, dashArray: "2 9", lineCap: "round" }); else dropLine("p" + u.id);
  }
  if (inc.help_radius_km && !lines["r" + inc.help_radius_km] && inc.location) {
    lines["r" + inc.help_radius_km] = L.circle([inc.location.lat, inc.location.lon], { radius: inc.help_radius_km * 1000, color: "#0F766E", weight: 2, dashArray: "6 8", fillOpacity: 0.05, interactive: false }).addTo(map);
  }
  for (const u of snap.users) {
    if (u.kind === "helper" && u.route && ["accepted", "confirmed", "on_scene"].includes(inc.helpers[u.id])) {
      setLine("h" + u.id, u.route, { color: "#0F766E", weight: 4, dashArray: "2 9", lineCap: "round" });
    }
  }
}

// ---------------------------------------------------------------- the list and the timeline

function renderList() {
  document.getElementById("no-incidents").hidden = list.length > 0;
  document.getElementById("incidents").innerHTML = list.map(i => {
    const who = i.victim_name || (i.flags?.unknown_victim ? "Unknown person" : "Someone");
    return `<li><button type="button" data-incident="${i.id}" data-mood="${MOOD[i.status_code] ?? "watch"}" ${i.id === selected ? 'aria-current="true"' : ""}>
      <b>${i.kind === "dead_zone" ? "Dead zone" : "Crash"} ${i.id}: ${esc(who)}</b><span>${esc(i.status)}</span></button></li>`;
  }).join("");
}

// The agent's own actions and what comes back, as short lines over the map. They fade after a few seconds.
function renderTicker(s, fresh) {
  const events = s ? s.events.filter(e => e.who === "agent") : [];
  const fromHere = fresh ? Math.max(0, events.length - 1) : eventCount;
  eventCount = events.length;
  for (const e of events.slice(fromHere)) {
    const el = document.createElement("div");
    el.className = "tick";
    el.textContent = e.text;
    ticker.append(el);
    while (ticker.children.length > 3) ticker.firstChild.remove();
    setTimeout(() => el.classList.add("out"), 6600);
    setTimeout(() => el.remove(), 7100);
  }
}

// ---------------------------------------------------------------- the incident panel

const canDispatch = inc => !!inc && ["detected", "agent_confirmed", "overdue"].includes(inc.stage) && !inc.dispatch;

function ambulancesHtml(list, inc) {
  const open = list.filter(a => a.state === "available" && a.eta_s);
  const fastest = canDispatch(inc) && open.length ? open.reduce((x, y) => (y.eta_s < x.eta_s ? y : x)).id : null;
  return `<h2>Ambulances</h2><div class="block">${list.map(a => ambulanceHtml(a, inc, a.id === fastest)).join("")}</div>`;
}

function ambulanceHtml(a, inc, best) {
  const d = inc?.dispatch?.ambulance_id === a.id ? inc.dispatch : null;
  let status = a.state === "busy" ? `<span class="tag">Busy</span>` : a.state === "on_scene" ? `<span class="tag ok">On scene</span>` : a.state === "dispatched" ? `<span class="tag ok">On the way</span>` : a.state === "transport" ? `<span class="tag ok">To hospital</span>` : d?.state === "delivered" ? `<span class="tag ok">At hospital</span>` : `<span class="tag">Available</span>`;
  const note = a.note ? `<div class="muted">${esc(a.note)}</div>` : "";
  let body = "";
  if (d?.state === "delivered") {
    body = `<div class="muted">Patient delivered to ${esc(hospitalName(inc.hospital?.hospital_id))}</div>`;
  } else if (d) {
    if (d.state === "transport") body = `<div class="muted">Taking the patient to ${esc(hospitalName(inc.hospital?.hospital_id))}</div>`;
    body += `<div class="eta" data-eta>ETA ${minutes(d.eta_remaining_s)}</div><div class="meter"><i data-meter style="width:${d.progress * 100}%"></i></div>`;
  } else if (a.state === "available") {
    const can = canDispatch(inc);
    body = `<div class="row"><span class="quick">${a.eta_s ? `ETA to the crash <b>${minutes(a.eta_s)}</b>` : ""}</span><button type="button" data-dispatch="${a.id}" ${can ? "" : "disabled"}>Dispatch</button></div>`;
  }
  if (best) status = `<span class="tag best">Fastest</span> ${status}`;
  return `<div class="card" data-best="${!!best}"><div class="row"><b>${esc(a.name)}</b><span>${status}</span></div>${note}${body}</div>`;
}

function helperHtml(u, state) {
  if (!u) return "";
  const tag = { requested: "Alerted", accepted: "Accepted", declined: "Can't help", confirmed: "Confirmed", on_scene: "On scene" }[state];
  let more = "";
  if (["accepted", "confirmed", "on_scene"].includes(state)) {
    more = `<div>Phone <b>${esc(u.phone)}</b></div>`;
    if (calling[u.id]) more += `<div class="calling">Calling ${esc(u.phone)}: give directions and check they are going</div>`;
    if (state === "accepted") more += `<div class="actions"><button type="button" class="quiet" data-call="${u.id}">Call</button><button type="button" data-choose="${u.id}">Confirm helper</button></div>`;
    else if (state === "confirmed") more += `<div class="done">You confirmed ${esc(u.name)} is going</div>`;
  }
  const how = u.eta_s ? `, ${minutes(u.eta_s)} by road` : "";
  return `<div class="card"><div class="row"><b>${esc(u.name)}</b><span class="tag ${["confirmed", "on_scene"].includes(state) ? "ok" : ""}">${tag}</span></div><div class="muted">${esc(u.skill || "Helper")}</div><div class="muted">${u.distance_km} km away${how}</div>${more}</div>`;
}

function personHtml(inc) {
  const p = inc.profile;
  if (!p) {
    return `<h2>The person</h2><div class="block person"><b>${esc(inc.victim_name || "Unknown person")}</b><br>${inc.flags?.unknown_victim ? "No person is registered for this blackbox." : "The profile is closed with the incident."}</div>`;
  }
  const bits = [p.age ? `${p.age}` : null, p.blood_type ? `blood type ${p.blood_type}` : null].filter(Boolean).join(", ");
  const contact = p.emergency_contact_name ? `${p.emergency_contact_name}${p.emergency_contact_phone ? ", " + p.emergency_contact_phone : ""}` : "not set";
  const first = (p.name || "").split(" ")[0];
  return `<h2>The person</h2><div class="block person"><b>${esc(p.name)}</b>${bits ? ", " + esc(bits) : ""}<br>${esc(p.conditions || "No conditions on file.")}<br>Phone ${esc(p.phone)}<br>Emergency contact: ${esc(contact)}<div class="actions"><button type="button" class="quiet" data-phone="user">Call ${esc(first)}</button><button type="button" class="quiet" data-phone="contact">Call the contact</button></div></div>`;
}

function helpButtonsHtml(inc, usable) {
  return `<div class="actions">${inc.helper_ranges.map((r, i) => {
    const label = r.available ? `${i ? "Widen to" : "Call for help within"} ${r.km} km (${r.available})` : r.count ? `Helpers within ${r.km} km alerted` : `No helpers within ${r.km} km`;
    return `<button type="button" data-help="${r.km}" ${usable && r.available ? "" : "disabled"}>${label}</button>`;
  }).join("")}${inc.police_ranges.map((r, i) => {
    const label = r.available ? `${i ? "Widen police to" : "Send police within"} ${r.km} km (${r.available})` : r.count ? `Police within ${r.km} km sent` : `No police within ${r.km} km`;
    return `<button type="button" data-police="${r.km}" ${usable && r.available ? "" : "disabled"}>${label}</button>`;
  }).join("")}</div>`;
}

function warnButtonsHtml(dz) {
  return `<button type="button" data-warn="dont_go" ${dz.warned ? "disabled" : ""}>${dz.warned ? "Warned not to go" : "Warn them not to go"}</button>`
    + `<button type="button" data-warn="no_help" ${dz.told_no_help ? "disabled" : ""}>${dz.told_no_help ? "Told help can't reach them" : "Tell them help can't reach them"}</button>`;
}

function helpersSection(s) {
  const inc = s.incident;
  const helpers = Object.entries(inc.helpers).map(([uid, state]) => helperHtml(s.users.find(u => u.id === Number(uid)), state)).join("");
  return helpers ? `<h2>Helpers</h2><div class="block">${helpers}</div>` : "";
}

function policeHtml(u) {
  const tag = { en_route: "On the way", on_scene: "On scene" }[u.state];
  return `<div class="card"><div class="row"><b>${esc(u.name)}</b><span class="tag ok">${tag}</span></div><div class="muted">${u.distance_km} km away, ${minutes(u.eta_s)} by road</div></div>`;
}

function policeSection(s) {
  const police = s.incident.police.map(policeHtml).join("");
  return police ? `<h2>Police and Gendarmerie</h2><div class="block">${police}</div>` : "";
}

function hospitalsHtml(inc) {
  const sent = inc?.hospital;
  const usable = inc && ["detected", "agent_confirmed", "dispatched", "on_scene"].includes(inc.stage);
  const rows = hospitals.map((x, i) => {
    const chosen = sent?.hospital_id === x.id;
    const meta = [x.distance_km !== undefined ? `${x.distance_km} km` : null, `${x.beds_free} of ${x.beds_total} beds free`,
                  x.missing_specialties?.length ? `no ${x.missing_specialties.join(", ")}` : null].filter(Boolean).join(", ");
    const suggested = usable && !sent && i === 0 ? `<span class="tag best">Suggested</span>` : "";
    const action = chosen ? `<span class="tag ok">Patient sent</span>`
      : `<button type="button" class="${suggested ? "" : "quiet"}" data-hospital="${x.id}" ${usable && !sent ? "" : "disabled"}>Send patient</button>`;
    return `<div class="card"><div class="row"><b>${esc(x.name)}</b>${suggested}</div><div class="muted">${esc(meta)}</div><div class="actions">${action}</div></div>`;
  }).join("");
  return `<h2>Hospitals</h2><div class="block">${rows || `<div class="muted">No hospital.</div>`}${usable || sent || !inc ? "" : `<p class="hint">Available once a crash is detected.</p>`}</div>`;
}
let hospitals = [];
const hospitalName = id => hospitals.find(h => h.id === id)?.name ?? `hospital ${id}`;

// Scenario 3: nothing comes from the car, so the agent works from what the driver said before going in
function deadZoneHtml(s) {
  const inc = s.incident, dz = s.dead_zone, stage = inc.stage;
  let html = `<div class="incident-head" data-mood="${dz.found ? "clear" : MOOD[stage] ?? "watch"}"><small>Dead-zone check-in, ${esc(dz.road)}</small><strong>${esc(inc.status)}</strong></div>`;
  html += `<div class="block"><div class="row"><span class="muted">Expected back</span><b>${esc(hhmm(dz.back_by))}${dz.back_defaulted ? " (from the route's ETA)" : ""}</b></div>`;
  html += `<div class="row"><span class="muted">Last known position</span><b>${dz.last_seen_at ? `at ${esc(hhmm(dz.last_seen_at))}, zone entrance` : "Still has network"}</b></div></div>`;
  html += personHtml(inc);
  if (dz.phase === "driving") {
    html += `<h2>Your actions</h2><div class="block"><div class="actions">${warnButtonsHtml(dz)}</div></div>`;
  } else if (dz.phase === "in_zone") {
    html += `<h2>Your actions</h2><div class="block muted">Out of reach until they come back. If they aren't back by ${esc(hhmm(dz.back_by))}, help goes to the last known position.</div>`;
  } else if (!["turned_back", "returned"].includes(dz.phase)) {
    html += `<h2>Your actions</h2><div class="block">${helpButtonsHtml(inc, ["overdue", "dispatched"].includes(stage))}</div>`;
    html += helpersSection(s) + policeSection(s);
  }
  return html;
}

function popupHtml(s) {
  const dz = s.dead_zone;
  if (!dz || !s.incident || dz.acknowledged) return "";
  const name = s.incident.victim_name || "The driver";
  if (dz.phase === "driving") {
    return `<h3>${esc(name)} is heading into a no-coverage zone</h3><p>On ${esc(dz.road)}, expected back by <b>${esc(hhmm(dz.back_by))}</b>. Once the signal goes, nothing reaches us. Is the road safe to go in?</p>
      <div class="actions"><button type="button" class="quiet" data-phone="user">Call ${esc(name.split(" ")[0])}</button>${warnButtonsHtml(dz)}<button type="button" class="quiet" data-ack="1">OK, keep watching</button></div>`;
  }
  if (dz.phase === "overdue") {
    return `<h3>${esc(name)} is not back</h3><p>Expected by <b>${esc(hhmm(dz.back_by))}</b>. Last known position at ${esc(hhmm(dz.last_seen_at))}, at the zone's entrance. The emergency contact and the Gendarmerie are warned. Send help from the panel.</p>
      <div class="actions"><button type="button" class="quiet" data-ack="1">Got it</button></div>`;
  }
  return "";
}

function incidentHtml(s) {
  const inc = s.incident, sev = inc.severity;
  const stage = inc.stage;
  if (inc.kind === "dead_zone") return deadZoneHtml(s);
  let html = `<div class="incident-head" data-mood="${MOOD[stage] ?? "watch"}"><small>Incident ${inc.id} at ${clock(Date.parse(inc.created_at) / 1000)}${inc.flags?.unknown_victim ? ", unknown person" : ""}</small><strong>${esc(inc.status)}</strong></div>`;
  if (inc.m2) html += `<div class="block"><div class="row"><span class="muted">Crash model</span><b>${esc(inc.m2.level)}, ${pct(inc.m2.p_crash)}</b></div></div>`;
  if (inc.flags?.default_profile) html += `<div class="block muted">No medical profile: severity assumes a default adult.</div>`;
  if (!inc.location && inc.m2) html += `<div class="block"><b>No location.</b> Click the map to place the crash: nothing can be sent before that.</div>`;
  if (sev) {
    const shown = inc.agent.severity ?? sev.shown;
    const estimate = sev.m3 ? (inc.agent.severity ? "set by you" : shown !== sev.m3.level ? "raised by the SOS" : `estimate ${pct(sev.m3.p)}`) : "from the SOS";
    html += `<h2>How badly hurt</h2><div class="block"><div class="row"><span class="level" data-level="${shown}">${shown}</span><span class="muted">${estimate}</span></div>`;
    if (sev.m4.length) html += `<div class="muted">Check first</div><ul class="regions">${sev.m4.map(r => `<li data-state="${r.state}"><span>${esc(r.region)}</span><span class="bar"><i style="width:${Math.min(100, r.p * 100 / 0.6)}%"></i></span><span class="state">${r.state}</span></li>`).join("")}</ul>`;
    html += `</div>`;
    html += personHtml(inc);
    const usable = ["detected", "agent_confirmed", "dispatched", "on_scene"].includes(stage);
    if (severityChoice === null || !severityTouched) severityChoice = shown;
    html += `<h2>Your actions</h2><div class="block">`;
    html += inc.agent.confirmed
      ? `<div class="done">You confirmed the crash. Severity: ${esc(inc.agent.severity)}</div>`
      : `<div class="actions"><select id="severity" aria-label="Severity">${LEVELS.map(l => `<option ${l === severityChoice ? "selected" : ""}>${l}</option>`).join("")}</select><button type="button" id="confirm" ${usable ? "" : "disabled"}>Confirm crash</button></div>`;
    html += `${helpButtonsHtml(inc, usable)}</div>`;
  }
  html += helpersSection(s) + policeSection(s);
  return html;
}

function emptyPanelHtml() {
  return `<h2>No incident</h2><div class="empty">Waiting for a crash.</div>`;
}

// What changes the layout, not the moving parts: positions and the ETA counting down update in place
function structure(s) {
  const strip = ({ pos, eta_remaining_s, progress, route, ...rest }) => rest;
  const inc = s.incident && { ...s.incident, dispatch: s.incident.dispatch && strip(s.incident.dispatch), police: s.incident.police.map(strip), updated_at: 0, events: 0, notifications: 0, people: 0, ambulances: 0, server_time: 0 };
  return JSON.stringify([inc, s.ambulances.map(strip), s.users.map(({ pos, distance_km, route, ...rest }) => rest), Object.keys(calling), hospitals.map(h => [h.id, h.beds_free, h.missing_specialties])]);
}

function renderPanel(s) {
  const next = s ? structure(s) : "empty" + JSON.stringify(ambulances.map(a => [a.id, a.state]));
  if (next !== sig) {
    sig = next;
    if (!s) { severityChoice = null; severityTouched = false; }
    panel.innerHTML = s ? incidentHtml(s) : emptyPanelHtml();
    fleet.innerHTML = ambulancesHtml(s ? s.ambulances : ambulances, s?.incident) + hospitalsHtml(s?.incident);
    popup.innerHTML = s ? popupHtml(s) : "";
    popup.dataset.mood = s?.dead_zone?.phase === "overdue" ? "alarm" : "watch";
  }
  const d = s?.incident?.dispatch;
  const eta = fleet.querySelector("[data-eta]"), meter = fleet.querySelector("[data-meter]");
  if (d && eta) { eta.textContent = `ETA ${minutes(d.eta_remaining_s)}`; meter.style.width = `${d.progress * 100}%`; }
}

panel.addEventListener("change", e => { if (e.target.id === "severity") { severityChoice = e.target.value; severityTouched = true; } });
async function onAction(e) {
  const b = e.target.closest("button");
  if (!b || b.disabled || !snap?.incident) return;
  const id = snap.incident.id;
  b.disabled = true;
  if (b.id === "confirm") await post(`/incidents/${id}/confirm`, { severity: document.getElementById("severity").value });
  else if (b.dataset.help) await post(`/incidents/${id}/call-helpers`, { radius_km: Number(b.dataset.help) });
  else if (b.dataset.police) await post(`/incidents/${id}/call-police`, { radius_km: Number(b.dataset.police) });
  else if (b.dataset.warn) await post(`/incidents/${id}/warn`, { message: b.dataset.warn });
  else if (b.dataset.ack) await post(`/incidents/${id}/acknowledge`);
  else if (b.dataset.phone) { await post(`/incidents/${id}/call`, { who: b.dataset.phone }); b.disabled = false; }
  else if (b.dataset.dispatch) await post(`/incidents/${id}/dispatch`, { ambulance_id: b.dataset.dispatch });
  else if (b.dataset.choose) await post(`/incidents/${id}/confirm-helper`, { user_id: Number(b.dataset.choose) });
  else if (b.dataset.hospital) await post(`/incidents/${id}/assign-hospital`, { hospital_id: Number(b.dataset.hospital) });
  else if (b.dataset.call) { calling[b.dataset.call] = Date.now(); sig = ""; renderPanel(snap); setTimeout(() => { delete calling[b.dataset.call]; sig = ""; renderPanel(snap); }, 6000); }
}
panel.addEventListener("click", onAction);
fleet.addEventListener("click", onAction);
popup.addEventListener("click", onAction);
document.getElementById("incidents").addEventListener("click", e => {
  const b = e.target.closest("button[data-incident]");
  if (b) select(Number(b.dataset.incident));
});

// ---------------------------------------------------------------- data

// The panel was written for one snapshot of the world; this builds it from what the API returns
function toSnap(d) {
  return { incident: d, dead_zone: d.dead_zone, events: d.events, users: d.people, ambulances: d.ambulances, server_time: d.server_time };
}

async function select(id) {
  const changed = id !== shown;
  selected = shown = id;
  if (changed) { severityChoice = null; severityTouched = false; eventCount = 0; dropAll(); sig = ""; }
  detail = id === null ? null : await get(`/incidents/${id}`);
  if (detail && detail.id === undefined) { selected = shown = detail = null; return; }   // a reset deleted it while this was on its way
  snap = detail && toSnap(detail);
  const row = detail && list.find(i => i.id === id);     // the list was fetched a moment earlier: the detail is newer
  if (row) { row.status = detail.status; row.status_code = detail.stage; }
  if (snap) ambulances = snap.ambulances;
  renderList(); renderTicker(snap, changed); renderPanel(snap);
  if (changed) fitToIncident();
  renderMap();
}

async function refresh() {
  list = await get("/incidents");
  units = await get("/police/units");
  // What just ended (no crash, turned back) stays on screen until the agent moves on or another incident needs them
  if (selected !== null && !list.some(i => i.id === selected)) {
    const r = await call("GET", `/incidents/${selected}`);
    if (r.ok && !list.length) { const d = await r.json(); list = [{ ...d, severity: d.severity?.shown, status_code: d.stage }]; }
    else selected = null;
  }
  if (selected === null && list.length) selected = list[0].id;
  if (list.length) {
    const suggested = selected ? await get(`/incidents/${selected}/hospital-suggestions`).catch(() => null) : null;
    if (Array.isArray(suggested)) hospitals = suggested;
    await select(selected);
  } else {
    detail = snap = null; selected = shown = null; sig = ""; eventCount = 0;
    ambulances = (await get("/ambulances")).map(a => ({ ...a, pos: a.location && [a.location.lat, a.location.lon] }));
    renderList(); renderTicker(null, true); renderPanel(null); dropAll(); renderMap();
  }
}

let pending = null;
function refreshSoon() { clearTimeout(pending); pending = setTimeout(() => refresh().catch(() => {}), 120); }

function onUnitMoved(u) {
  const i = units.findIndex(x => x.id === u.id);
  if (i >= 0) units[i] = u;
  renderMap();
}

function onMoved(a) {
  const i = ambulances.findIndex(x => x.id === a.id);
  if (i >= 0) ambulances[i] = { ...ambulances[i], state: a.state, pos: a.location ? [a.location.lat, a.location.lon] : ambulances[i].pos };
  const d = snap?.incident?.dispatch;
  if (d && d.ambulance_id === a.id && a.eta_remaining_s !== null) {
    d.eta_remaining_s = a.eta_remaining_s;
    d.progress = Math.max(0, 1 - a.eta_remaining_s / Math.max(d.eta_s, 1));
  }
  renderPanel(snap); renderMap();
}

// ---------------------------------------------------------------- login and the live feed

function setLink(up, text) { link.textContent = text; link.dataset.up = String(up); }

function logout() {
  token = null; localStorage.removeItem("solvex_token");
  socket?.disconnect(); socket = null;
  document.getElementById("login").hidden = false;
  document.getElementById("logout").hidden = true;
  document.getElementById("who").textContent = "";
  setLink(false, "Logged out");
}

function connect() {
  socket = io({ auth: { token }, transports: ["websocket", "polling"] });
  socket.on("connect", () => { setLink(true, "Connected to the server"); refresh().catch(() => {}); });
  socket.on("connect_error", () => setLink(false, "Server not reachable. Retrying."));
  socket.on("disconnect", () => setLink(false, "Server not reachable. Retrying."));
  socket.on("incident.updated", refreshSoon);
  socket.on("reset", () => { selected = null; refreshSoon(); });   // the incidents are gone: asking for the old one would be a 404
  socket.on("ambulance.moved", onMoved);
  socket.on("police.moved", onUnitMoved);
}

async function enter() {
  const me = await fetch(`${API}/me`, { headers: authHeaders() });
  if (!me.ok) { logout(); return; }
  const user = await me.json();
  if (!["dispatcher", "admin"].includes(user.role)) { logout(); document.getElementById("login-error").textContent = "This page is for Protection Civile agents."; return; }
  document.getElementById("who").textContent = user.name;
  document.getElementById("login").hidden = true;
  document.getElementById("logout").hidden = false;
  centres = await get("/centres");
  stations = await get("/police/stations");
  hospitals = await get("/hospitals").catch(() => []);
  connect();
  setInterval(() => socket?.connected && refresh().catch(() => {}), 10000);
}

document.getElementById("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const r = await fetch(`${API}/auth/login`, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ phone: document.getElementById("phone").value.trim(), password: document.getElementById("password").value }) });
  if (!r.ok) { document.getElementById("login-error").textContent = "Wrong phone number or password."; return; }
  token = (await r.json()).token;
  localStorage.setItem("solvex_token", token);
  document.getElementById("login-error").textContent = "";
  enter();
});
document.getElementById("logout").addEventListener("click", logout);
