<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolveX live view</title>
<link rel="stylesheet" href="/static/panel.css">
<style>
  main { display: flex; flex-direction: column; }
  .row {
    flex: 1;
    display: grid;
    grid-template-columns: 3fr 2fr;
    min-height: 380px;
    border-bottom: 6px solid var(--concrete);
  }
  .scene { display: flex; flex-direction: column; min-width: 0; background: var(--tarmac); color: var(--white); }
  .scene canvas { flex: 1 1 0; height: 0; min-height: 0; width: 100%; object-fit: contain; }
  .caption { margin: 0; padding: 12px 20px; font-size: 1.25rem; min-height: 3.6em; line-height: 1.3; }
  .caption[data-tone="alarm"] { color: #ffb4ae; font-weight: 700; }
  .caption[data-tone="clear"] { color: #8fe0c0; font-weight: 700; }
  .row .car { border-width: 0 0 0 6px; }
  .empty code { display: block; margin-top: 12px; font-size: 1.1rem; overflow-wrap: anywhere; }
  @media (max-width: 800px) {
    .row { grid-template-columns: 1fr; }
    .scene canvas { flex: none; height: auto; }
  }
</style>
</head>
<body>
<header>
  <span>SolveX live view</span>
  <nav>
    <span id="link" data-up="false" role="status">Connecting to the server</span>
    <a href="/dev/monitor" target="_blank" rel="noopener">Open the monitor</a>
    <button id="reset-all" type="button">Reset all</button>
  </nav>
</header>
<main id="rows">
  <div class="empty" id="empty">Waiting for a blackbox. It appears here as soon as someone starts one:
    <code id="example"></code>
  </div>
</main>

<script src="/static/common.js"></script>
<script src="/static/scenes.js"></script>
<script src="/static/panel.js"></script>
<script>
const SCENE = {
  crash: { kind: "crash", cruise: 20.3, color: "#3b82c4" },
  braking: { kind: "brake", cruise: 25, color: "#e07b39" },
  normal: { kind: "loop", cruise: 0, color: "#eceff0" },
};

const rows = new Map();
const main = document.getElementById("rows");
const link = document.getElementById("link");
const empty = document.getElementById("empty");
document.getElementById("example").textContent = `curl -N http://${location.host}/blackbox/blackbox-01/crash`;

function removeRow(id) {
  rows.get(id)?.row.remove();
  rows.delete(id);
  if (!rows.size) main.append(empty);
}

function clearRows() {
  [...rows.keys()].forEach(removeRow);
}

document.getElementById("reset-all").addEventListener("click", async () => {
  const response = await fetch("/api/reset", { method: "POST" }).catch(() => null);
  if (!response?.ok) link.textContent = "Reset failed. Restart the server.";
});

function addRow(m) {
  removeRow(m.device_id);
  const row = document.createElement("section");
  row.className = "row";
  row.innerHTML = `<div class="scene"><canvas width="${W}" height="${H}"></canvas><p class="caption"></p></div>`;
  const panel = createPanel(m.device_id);
  row.append(panel.el);
  empty.remove();
  main.append(row);
  const canvas = row.querySelector("canvas");
  canvas.setAttribute("aria-label", `${m.device_id}: ${m.scenario}`);
  const car = {
    ...SCENE[m.scenario], id: m.device_id, row, panel, ctx: canvas.getContext("2d"), caption: row.querySelector(".caption"),
    scn: null, x: 0, fx: [], result: null, resultAt: 0, impactDone: false, lastSmoke: 0, leadOn: true, stopped: false,
    // The scenario starts after the lead-in of normal driving, counted from when the blackbox started
    scenarioAt: m.scenario === "normal" ? null : performance.now() + (m.lead_in_s - m.elapsed_s) * 1000,
  };
  rows.set(m.device_id, car);
  render(panel);
}

function onMessage(m) {
  if (m.type === "reset") return clearRows();
  if (m.type === "blackbox_started") return addRow(m);
  const car = rows.get(m.device_id);
  if (!car) return;
  if (m.type === "car_removed") return removeRow(m.device_id);
  if (m.type === "blackbox_stopped") { car.stopped = true; return; }
  applyToPanel(car.panel, m);
  if (m.type === "prediction") { car.result = m; car.resultAt = performance.now(); }
}

function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${scheme}://${location.host}/ws/monitor`);
  ws.onopen = () => {  // the server replays what is running, so anything left on the page is out of date
    clearRows();
    link.textContent = "Connected to the server";
    link.dataset.up = "true";
  };
  ws.onmessage = e => onMessage(JSON.parse(e.data));
  ws.onclose = () => {
    link.textContent = "Server not reachable. Retrying.";
    link.dataset.up = "false";
    setTimeout(connect, 1000);
  };
}

let lastFrame = performance.now();
function frame() {
  requestAnimationFrame(frame);    // first, so that an error in one frame can't stop the animation
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  for (const car of rows.values()) {
    if (car.scenarioAt !== null && now >= car.scenarioAt) {
      car.scn = { startAt: car.scenarioAt, x0: car.x };
      car.leadWasVisible = true;
      car.scenarioAt = null;
    }
    // Stopped early: the picture stops there. After a crash, the wreck keeps smoking
    if (car.stopped && !car.impactDone) continue;
    const p = update(car, now, dt);
    drawScene(car, now, p);
    const [text, tone] = captionFor(car, p, now);
    if (car.caption.textContent !== text) car.caption.textContent = text;
    car.caption.dataset.tone = tone;
  }
}

connect();
setInterval(() => rows.forEach(car => render(car.panel)), 500);
requestAnimationFrame(frame);
</script>
</body>
</html>
