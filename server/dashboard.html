<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolveX Protection Civile</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<style>
  /* System fonts only: the demo has to work with no internet */
  :root {
    --tarmac: #24343d;
    --tarmac-soft: #3a4c56;
    --tarmac-line: #4a5e69;
    --concrete: #e6eaea;
    --line: #f5bc00;
    --alarm: #c8231b;
    --clear: #17785a;
    --blue: #2f6fb3;
    --white: #ffffff;
    --font: "Bahnschrift", "DIN Alternate", "Barlow", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--concrete); color: var(--tarmac); font-family: var(--font); overflow: hidden; }
  header { flex: none; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 10px 20px; background: var(--tarmac); color: var(--white); }
  header strong { font-size: 1.2rem; }
  header span.where { color: #b9c4c9; margin-left: 12px; }
  header nav { display: flex; gap: 20px; align-items: baseline; }
  header a { color: var(--white); font-weight: 700; }
  #link[data-up="false"] { color: #ffb4ae; font-weight: 700; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 330px minmax(0, 1fr) 400px; }
  aside { min-height: 0; overflow-y: auto; background: var(--tarmac); color: var(--white); }
  aside.left { border-right: 4px solid var(--concrete); }
  aside.right { border-left: 4px solid var(--concrete); }
  h2 { margin: 0; padding: 14px 16px 8px; font-size: 1.05rem; font-weight: 700; color: #b9c4c9; }
  section { padding-bottom: 6px; }
  .empty { padding: 20px 16px; font-size: 1.2rem; line-height: 1.4; color: #b9c4c9; }

  .timeline { margin: 0; padding: 0 16px 16px; list-style: none; }
  .timeline li { padding: 9px 0; border-top: 1px solid var(--tarmac-line); line-height: 1.35; }
  .timeline time { display: block; font-size: .85rem; color: var(--line); }
  .timeline li.fresh { animation: fresh 2.4s ease-out; }
  @keyframes fresh { from { background: rgba(245, 188, 0, .35); } to { background: transparent; } }
  .timeline li[data-kind="m2"], .timeline li[data-kind="trigger"], .timeline li[data-kind="sos"] { font-weight: 700; }

  #map { position: relative; background: #e3e9e6; }
  .legend { position: absolute; z-index: 800; left: 12px; bottom: 28px; background: rgba(255,255,255,.94); padding: 8px 12px; font-size: .9rem; line-height: 1.7; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
  .pin { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: var(--white); font: 700 .95rem var(--font); border: 3px solid var(--white); box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .pin.amb { border-radius: 4px; background: var(--line); color: var(--tarmac); }
  .pin.amb[data-moving="true"] { box-shadow: 0 0 0 4px rgba(245,188,0,.45); }
  .pin.station { border-radius: 4px; background: var(--tarmac); width: 34px; }
  .pin.user { background: var(--blue); }
  .pin.victim { background: var(--alarm); }
  .pin.helper { background: var(--clear); }
  .pin.crash { width: 44px; height: 44px; background: var(--alarm); font-size: 1.5rem; animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(200,35,27,.7); } 100% { box-shadow: 0 0 0 26px rgba(200,35,27,0); } }

  .incident-head { padding: 14px 16px 16px; }
  .incident-head[data-mood="watch"] { background: var(--line); color: var(--tarmac); }
  .incident-head[data-mood="alarm"] { background: var(--alarm); }
  .incident-head[data-mood="move"] { background: var(--tarmac-soft); border-bottom: 5px solid var(--line); }
  .incident-head[data-mood="clear"] { background: var(--clear); }
  .incident-head small { display: block; opacity: .85; font-size: .95rem; }
  .incident-head strong { display: block; margin-top: 4px; font-size: 1.55rem; line-height: 1.15; }
  .block { padding: 4px 16px 10px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 3px 0; }
  .level { font-size: 1.7rem; font-weight: 700; text-transform: capitalize; }
  .level[data-level="extreme"], .level[data-level="high"] { color: #ffb4ae; }
  .regions { margin: 6px 0 0; padding: 0; list-style: none; }
  .regions li { display: grid; grid-template-columns: 5.5em 1fr 4.2em; align-items: center; gap: 8px; padding: 3px 0; font-size: .98rem; text-transform: capitalize; }
  .bar { height: 10px; background: var(--tarmac-soft); }
  .bar i { display: block; height: 100%; background: #8fa0a8; }
  .regions li[data-state="likely"] .bar i { background: var(--alarm); }
  .regions li[data-state="check"] .bar i { background: var(--line); }
  .regions li[data-state="unlikely"] { color: #8fa0a8; }
  .state { text-align: right; font-size: .9rem; text-transform: none; }
  .person { line-height: 1.45; }
  .person b { font-size: 1.1rem; }
  .muted { color: #b9c4c9; }

  button, select { font: inherit; font-weight: 700; border: 0; border-radius: 0; padding: 9px 14px; }
  button { cursor: pointer; background: var(--line); color: var(--tarmac); }
  button:disabled { background: var(--tarmac-soft); color: #8fa0a8; cursor: default; }
  button.quiet { background: var(--tarmac-soft); color: var(--white); }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }
  select { background: var(--white); color: var(--tarmac); text-transform: capitalize; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; margin-top: 6px; }
  .actions > * { flex: 1 1 auto; }
  .done { padding: 8px 0; color: #8fe0c0; font-weight: 700; }

  .card { background: var(--tarmac-soft); padding: 10px 12px; margin-top: 8px; line-height: 1.4; }
  .card .row b { font-size: 1.05rem; }
  .card .eta { font-size: 1.9rem; font-weight: 700; color: var(--line); }
  .card .meter { height: 6px; background: var(--tarmac); margin-top: 6px; }
  .card .meter i { display: block; height: 100%; background: var(--line); }
  .tag { font-size: .85rem; padding: 2px 8px; background: var(--tarmac); color: #b9c4c9; }
  .tag.ok { background: var(--clear); color: var(--white); }
  .calling { color: var(--line); font-weight: 700; }

  @media (max-width: 1000px) {
    body { height: auto; overflow: auto; }
    main { grid-template-columns: 1fr; }
    #map { height: 60vh; }
    aside { overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) { .pin.crash, .timeline li.fresh { animation: none; } }
</style>
</head>
<body>
<header>
  <div><strong>Protection Civile</strong><span class="where">Bouira, demo centre</span></div>
  <nav>
    <span id="link" data-up="false" role="status">Connecting to the server</span>
    <a href="/dev" target="_blank" rel="noopener">Open dev</a>
  </nav>
</header>
<main>
  <aside class="left">
    <h2>What is happening</h2>
    <div class="empty" id="no-events">No incident. This list fills as soon as a crash is detected.</div>
    <ol class="timeline" id="timeline"></ol>
  </aside>
  <div id="map" role="application" aria-label="Map">
    <div class="legend">
      <div><i style="background:var(--alarm)"></i>Crash, person in the accident</div>
      <div><i style="background:var(--blue)"></i>People nearby</div>
      <div><i style="background:var(--clear)"></i>Helpers</div>
      <div><i style="background:var(--line);border-radius:3px"></i>Ambulances</div>
    </div>
  </div>
  <aside class="right" id="panel"></aside>
</main>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script>
"use strict";
const STALE_NEW_MS = 2500;
const LEVELS = ["low", "medium", "high", "extreme"];
const MOOD = { analyzing: "watch", detected: "alarm", agent_confirmed: "alarm", dispatched: "move", on_scene: "clear", false_alarm: "clear" };
const link = document.getElementById("link");
const panel = document.getElementById("panel");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clock = t => new Date(t * 1000).toLocaleTimeString("en-GB");
const pct = p => p >= 0.9995 ? "over 99.9%" : `${(p * 100).toFixed(1)}%`;
const minutes = s => s >= 90 ? `${Math.round(s / 60)} min` : `${Math.round(s)} s`;
const post = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}) });

let snap = null, sig = "", eventCount = 0, geo = null, places = null, place = null;
const streets = {};   // place -> the layer of its streets
let severityChoice = null, severityTouched = false;
const calling = {};   // user id -> when the agent pressed Call (a mock: there is no phone line yet)

// ---------------------------------------------------------------- map

const map = L.map("map", { zoomControl: true, attributionControl: true, minZoom: 10, maxZoom: 18, preferCanvas: true });
map.attributionControl.setPrefix(false);
map.attributionControl.addAttribution("Streets © OpenStreetMap contributors");
const WIDTH = { motorway: 7, trunk: 7, primary: 6, secondary: 5, tertiary: 4, unclassified: 3, residential: 3, living_street: 2, service: 2 };
const markers = {}, lines = {};

function pin(cls, text, extra = "") {
  return L.divIcon({ className: "", html: `<div class="pin ${cls}" ${extra}>${text}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
}

function setMarker(key, position, icon, title) {
  if (markers[key]) { markers[key].setLatLng(position).setIcon(icon); return; }
  markers[key] = L.marker(position, { icon, title, keyboard: false }).addTo(map);
}

function dropMarker(key) { if (markers[key]) { map.removeLayer(markers[key]); delete markers[key]; } }

function setLine(key, points, style) {
  if (lines[key]) return;
  lines[key] = L.polyline(points, style).addTo(map);
}

function dropLines() { Object.keys(lines).forEach(k => { map.removeLayer(lines[k]); delete lines[k]; }); }

async function setupMap() {
  places = await (await fetch("/api/map")).json();
  await showPlace("town");
}

async function showPlace(name) {
  if (name === place) return;
  place = name; geo = places[name];
  dropLines();
  Object.values(streets).forEach(layer => map.removeLayer(layer));
  const area = L.latLngBounds([geo.crash, geo.centre, ...Object.values(geo.helpers).map(h => h.geometry[0])]);
  map.setMaxBounds(null);
  map.fitBounds(area.pad(0.2), { animate: false });
  map.setMaxBounds(area.pad(1.2));
  streets[name] ??= await loadStreets(name, geo);
  if (place === name) streets[name].addTo(map);
  if (snap) renderMap();
}

// The streets are drawn from OpenStreetMap data, so the map works with no internet. Without the file, only the routes show.
async function loadStreets(name, area) {
  let roads = [];
  try { roads = await (await fetch(`/static/roads_${name}.json`)).json(); } catch (e) { /* no street file: fall back to the routes */ }
  if (!roads.length) roads = [{ c: "primary", p: area.ambulance.geometry }, ...Object.values(area.helpers).map(h => ({ c: "secondary", p: h.geometry }))];
  const layer = L.layerGroup();
  const draw = style => roads.forEach(r => L.polyline(r.p, { ...style(r), interactive: false, lineCap: "round", lineJoin: "round" }).addTo(layer));
  draw(r => ({ color: "#b7c3c1", weight: (WIDTH[r.c] ?? 2) + 2 }));   // outlines first, so crossings read as junctions
  draw(r => ({ color: "#ffffff", weight: WIDTH[r.c] ?? 2 }));
  return layer;
}

function renderMap() {
  if (!snap || !streets[place] || !map.hasLayer(streets[place])) return;
  const inc = snap.incident;
  setMarker("station", geo.centre, pin("station", "PC"), "Protection Civile centre");
  for (const a of snap.ambulances) {
    if (a.state === "busy") { dropMarker(a.id); continue; }
    setMarker(a.id, a.pos, pin("amb", a.id.slice(-1), `data-moving="${a.state === "dispatched"}"`), a.name);
  }
  if (!inc) {
    for (const u of snap.users) dropMarker("u" + u.id);
    dropMarker("crash"); dropLines();
    return;
  }
  setMarker("crash", inc.location, pin("crash", "!"), "Crash");
  for (const u of snap.users) {
    const cls = u.id === 0 ? "victim" : u.helper ? "helper" : "user";
    setMarker("u" + u.id, u.pos, pin(cls, u.id), u.name);
  }
  if (inc.dispatch) setLine("amb", geo.ambulance.geometry, { color: "#e0a800", weight: 5, dashArray: "2 10", lineCap: "round" });
  if (inc.help_radius_km && !lines["r" + inc.help_radius_km]) {
    lines["r" + inc.help_radius_km] = L.circle(inc.location, { radius: inc.help_radius_km * 1000, color: "#17785a", weight: 2, dashArray: "6 8", fillOpacity: 0.04, interactive: false }).addTo(map);
  }
  for (const [uid, state] of Object.entries(inc.helpers)) {
    if (["accepted", "confirmed", "on_scene"].includes(state)) setLine("h" + uid, geo.helpers[uid].geometry, { color: "#17785a", weight: 4, dashArray: "2 9", lineCap: "round" });
  }
}

// ---------------------------------------------------------------- timeline

function renderTimeline(s) {
  const events = s.events.filter(e => e.who === "agent");
  document.getElementById("no-events").hidden = events.length > 0;
  if (events.length === eventCount && events.length) return;
  const fresh = events.length - eventCount;
  eventCount = events.length;
  document.getElementById("timeline").innerHTML = events.slice().reverse()
    .map((e, i) => `<li data-kind="${e.kind}" class="${i < fresh && fresh <= 2 ? "fresh" : ""}"><time>${clock(e.t)}</time>${esc(e.text)}</li>`).join("");
}

// ---------------------------------------------------------------- the incident panel

function ambulanceHtml(a, inc) {
  const d = inc?.dispatch?.ambulance_id === a.id ? inc.dispatch : null;
  let status = a.state === "busy" ? `<span class="tag">Busy</span>` : a.state === "on_scene" ? `<span class="tag ok">On scene</span>` : a.state === "dispatched" ? `<span class="tag ok">On the way</span>` : `<span class="tag">Available</span>`;
  const note = a.note ? `<div class="muted">${esc(a.note)}</div>` : "";
  let body = "";
  if (d) {
    body = `<div class="eta" data-eta>ETA ${minutes(d.eta_remaining_s)}</div><div class="meter"><i data-meter style="width:${d.progress * 100}%"></i></div>`;
  } else if (a.state === "available") {
    const can = inc && ["detected", "agent_confirmed"].includes(inc.stage) && !inc.dispatch;
    body = `<div class="row"><span>ETA to the crash <b>${minutes(a.eta_s)}</b></span><button type="button" data-dispatch="${a.id}" ${can ? "" : "disabled"}>Dispatch</button></div>`;
  }
  return `<div class="card"><div class="row"><b>${esc(a.name)}</b>${status}</div>${note}${body}</div>`;
}

function helperHtml(u, state, inc) {
  const tag = { requested: "Alerted", accepted: "Accepted", declined: "Can't help", confirmed: "Confirmed", on_scene: "On scene" }[state];
  let more = "";
  if (["accepted", "confirmed", "on_scene"].includes(state)) {
    more = `<div class="muted">${esc(u.profile)}</div><div>Phone <b>${esc(u.phone)}</b></div>`;
    if (calling[u.id]) more += `<div class="calling">Calling ${esc(u.phone)}: give directions and check they are going</div>`;
    if (state === "accepted") more += `<div class="actions"><button type="button" class="quiet" data-call="${u.id}">Call</button><button type="button" data-choose="${u.id}">Confirm helper</button></div>`;
    else if (state === "confirmed") more += `<div class="done">You confirmed ${esc(u.name)} is going</div>`;
  }
  return `<div class="card"><div class="row"><b>${esc(u.name)}</b><span class="tag ${["confirmed", "on_scene"].includes(state) ? "ok" : ""}">${tag}</span></div><div class="muted">${esc(u.role)}</div><div class="muted">${u.distance_km} km away, ${minutes(u.eta_s)} by road</div>${more}</div>`;
}

function incidentHtml(s) {
  const inc = s.incident, victim = s.users[0], sev = inc.severity;
  const stage = inc.stage;
  let html = `<div class="incident-head" data-mood="${MOOD[stage]}"><small>Incident ${inc.id} at ${clock(s.events.find(e => e.kind === "trigger")?.t ?? s.server_time)}</small><strong>${esc(inc.status)}</strong></div>`;
  if (inc.m2) html += `<div class="block"><div class="row"><span class="muted">Crash model</span><b>${esc(inc.m2.level)}, ${pct(inc.m2.p_crash)}</b></div></div>`;
  if (sev) {
    const shown = inc.agent.severity ?? sev.shown;
    html += `<h2>How badly hurt</h2><div class="block"><div class="row"><span class="level" data-level="${shown}">${shown}</span><span class="muted">${inc.agent.severity ? "set by you" : shown !== sev.m3.level ? "raised by the SOS" : `estimate ${pct(sev.m3.p)}`}</span></div>`;
    html += `<div class="muted">Check first</div><ul class="regions">${sev.m4.map(r => `<li data-state="${r.state}"><span>${esc(r.region)}</span><span class="bar"><i style="width:${Math.min(100, r.p * 100 / 0.6 * 1)}%"></i></span><span class="state">${r.state}</span></li>`).join("")}</ul></div>`;
    html += `<h2>The person</h2><div class="block person"><b>${esc(victim.name)}</b>, ${victim.age}<br>${esc(victim.profile)}<br>Phone ${esc(victim.phone)}<br>Emergency contact: ${esc(victim.emergency_contact)}<div class="actions"><button type="button" class="quiet" data-phone="user">Call ${esc(victim.name.split(" ")[0])}</button><button type="button" class="quiet" data-phone="contact">Call the contact</button></div></div>`;
    const usable = ["detected", "agent_confirmed", "dispatched"].includes(stage);
    if (severityChoice === null || !severityTouched) severityChoice = shown;
    html += `<h2>Your actions</h2><div class="block">`;
    html += inc.agent.confirmed
      ? `<div class="done">You confirmed the crash. Severity: ${esc(inc.agent.severity)}</div>`
      : `<div class="actions"><select id="severity" aria-label="Severity">${LEVELS.map(l => `<option ${l === severityChoice ? "selected" : ""}>${l}</option>`).join("")}</select><button type="button" id="confirm" ${usable ? "" : "disabled"}>Confirm crash</button></div>`;
    html += `<div class="actions">${inc.helper_ranges.map((r, i) => {
      const label = r.available ? `${i ? "Widen to" : "Call for help within"} ${r.km} km (${r.available})` : r.count ? `Helpers within ${r.km} km alerted` : `No helpers within ${r.km} km`;
      return `<button type="button" data-help="${r.km}" ${usable && r.available ? "" : "disabled"}>${label}</button>`;
    }).join("")}</div></div>`;
  }
  const helpers = Object.entries(inc.helpers).map(([uid, state]) => helperHtml(s.users.find(u => u.id === Number(uid)), state, inc)).join("");
  if (helpers) html += `<h2>Helpers</h2><div class="block">${helpers}</div>`;
  html += `<h2>Ambulances</h2><div class="block">${s.ambulances.map(a => ambulanceHtml(a, inc)).join("")}</div>`;
  return html;
}

function emptyPanelHtml(s) {
  return `<h2>No incident</h2><div class="empty">Waiting for a crash. Start a scenario from the dev screen.</div><h2>Ambulances</h2><div class="block">${s.ambulances.map(a => ambulanceHtml(a, null)).join("")}</div>`;
}

// What changes the layout, not the moving parts: positions and the ETA counting down update in place
function structure(s) {
  const strip = ({ pos, eta_s, ...rest }) => rest;
  const inc = s.incident && { ...s.incident, dispatch: s.incident.dispatch && { ambulance_id: s.incident.dispatch.ambulance_id, eta_s: s.incident.dispatch.eta_s } };
  return JSON.stringify([inc, s.ambulances.map(strip), s.users.map(strip), s.scenario?.key, Object.keys(calling)]);
}

function renderPanel(s) {
  const next = structure(s);
  if (next !== sig) {
    sig = next;
    if (!s.incident) { severityChoice = null; severityTouched = false; }
    panel.innerHTML = s.incident ? incidentHtml(s) : emptyPanelHtml(s);
  }
  const d = s.incident?.dispatch;
  const eta = panel.querySelector("[data-eta]"), meter = panel.querySelector("[data-meter]");
  if (d && eta) { eta.textContent = `ETA ${minutes(d.eta_remaining_s)}`; meter.style.width = `${d.progress * 100}%`; }
}

panel.addEventListener("change", e => { if (e.target.id === "severity") { severityChoice = e.target.value; severityTouched = true; } });
panel.addEventListener("click", async e => {
  const b = e.target.closest("button");
  if (!b || b.disabled || !snap?.incident) return;
  const id = snap.incident.id;
  b.disabled = true;
  if (b.id === "confirm") await post(`/api/incidents/${id}/confirm`, { severity: document.getElementById("severity").value });
  else if (b.dataset.help) await post(`/api/incidents/${id}/call-helpers`, { radius_km: Number(b.dataset.help) });
  else if (b.dataset.phone) { await post(`/api/incidents/${id}/call`, { who: b.dataset.phone }); b.disabled = false; }
  else if (b.dataset.dispatch) await post(`/api/incidents/${id}/dispatch`, { ambulance_id: b.dataset.dispatch });
  else if (b.dataset.choose) await post(`/api/incidents/${id}/choose-helper`, { user_id: Number(b.dataset.choose) });
  else if (b.dataset.call) { calling[b.dataset.call] = Date.now(); sig = ""; renderPanel(snap); setTimeout(() => { delete calling[b.dataset.call]; sig = ""; renderPanel(snap); }, 6000); }
});

// ---------------------------------------------------------------- the feed

function onSnapshot(s) {
  snap = s;
  if (s.place !== place) showPlace(s.place);
  renderTimeline(s); renderPanel(s); renderMap();
}

function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${scheme}://${location.host}/ws/ops`);
  ws.onopen = () => { link.textContent = "Connected to the server"; link.dataset.up = "true"; };
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === "state") onSnapshot(m); };
  ws.onclose = () => { link.textContent = "Server not reachable. Retrying."; link.dataset.up = "false"; setTimeout(connect, 1000); };
}

setupMap().then(connect);
</script>
</body>
</html>
